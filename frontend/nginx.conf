map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 70s;
        client_max_body_size 6m;
    }
    # index.html must always revalidate after a deploy so it cannot reference
    # chunks removed by the previous image. Fingerprinted assets are immutable.
    location = /index.html { expires -1; }
    location ~* \.(?:js|mjs|css|map|woff2|svg|png|ico)$ {
        try_files $uri =404;
        expires max;
    }
    location / { try_files $uri $uri/ /index.html; }
}

